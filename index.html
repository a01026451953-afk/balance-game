<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 밸런스 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #1a1d24; color: #ffffff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 1rem;
    }
    .card {
      background: #252932; width: 100%; max-width: 480px;
      padding: 2rem; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p.sub { color: #9ca3af; font-size: 0.9rem; margin-bottom: 1.8rem; }
    .btn-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.8rem; }
    button {
      padding: 1.1rem; font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      transition: transform 0.15s, opacity 0.2s; color: #fff;
    }
    button:active { transform: scale(0.98); }
    .btn-a { background: #4a7cff; }
    .btn-b { background: #ff5a5f; }
    .result-box { background: #1a1d24; padding: 1.2rem; border-radius: 12px; }
    .bar-wrap {
      display: flex; height: 24px; border-radius: 12px;
      overflow: hidden; background: #374151; margin: 0.8rem 0;
    }
    .bar-a { background: #4a7cff; width: 50%; transition: width 0.4s ease; }
    .bar-b { background: #ff5a5f; width: 50%; transition: width 0.4s ease; }
    .stats { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔥 오늘의 밸런스 게임</h1>
    <p class="sub">평생 한 가지만 선택해야 한다면?</p>

    <div class="btn-group">
      <button class="btn-a" id="vote-a">평생 탄산음료 안 마시기 🥤</button>
      <button class="btn-b" id="vote-b">평생 라면 안 먹기 🍜</button>
    </div>

    <div class="result-box">
      <div class="stats">
        <span id="text-a" style="color:#7aa2ff;">탄산 포기: 0표 (50%)</span>
        <span id="text-b" style="color:#ff8589;">라면 포기: 0표 (50%)</span>
      </div>
      <div class="bar-wrap">
        <div class="bar-a" id="bar-a"></div>
        <div class="bar-b" id="bar-b"></div>
      </div>
      <p id="total-text" style="font-size:0.8rem; color:#9ca3af;">총 0명 참여 중</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDR1u7z3e7qjVMpERFk2xgNDjy5h_MatiM",
      authDomain: "my-balance-app-940a2.firebaseapp.com",
      databaseURL: "https://my-balance-app-940a2-default-rtdb.firebaseio.com",
      projectId: "my-balance-app-940a2",
      storageBucket: "my-balance-app-940a2.firebasestorage.app",
      messagingSenderId: "270383430781",
      appId: "1:270383430781:web:057b655307dfc08a71c514"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const votesRef = ref(db, "votes");

    function castVote(option) {
      runTransaction(votesRef, (currentData) => {
        if (currentData === null) {
          return { a: option === "a" ? 1 : 0, b: option === "b" ? 1 : 0 };
        }
        currentData[option] = (currentData[option] || 0) + 1;
        return currentData;
      });
    }

    document.getElementById("vote-a").addEventListener("click", () => castVote("a"));
    document.getElementById("vote-b").addEventListener("click", () => castVote("b"));

    onValue(votesRef, (snapshot) => {
      const data = snapshot.val() || { a: 0, b: 0 };
      const countA = data.a || 0;
      const countB = data.b || 0;
      const total = countA + countB;

      const pctA = total === 0 ? 50 : Math.round((countA / total) * 100);
      const pctB = total === 0 ? 50 : 100 - pctA;

      document.getElementById("bar-a").style.width = pctA + "%";
      document.getElementById("bar-b").style.width = pctB + "%";
      document.getElementById("text-a").innerText = `탄산 포기: ${countA}표 (${pctA}%)`;
      document.getElementById("text-b").innerText = `라면 포기: ${countB}표 (${pctB}%)`;
      document.getElementById("total-text").innerText = `총 ${total}명 실시간 참여 중`;
    });
  </script>
</body>
</html>
